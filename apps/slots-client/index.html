<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Seven Slice</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --bg: #12101c;
        --panel: #1e1a2e;
        --text: #f2eefc;
        --muted: #9d95b8;
        --accent: #f5c542;
        --danger: #ff6b6b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, sans-serif;
      }
      #stage canvas { display: block; max-width: 100%; height: auto; border-radius: 12px; }
      #hud {
        width: min(100%, 540px);
        display: grid;
        grid-template-columns: repeat(3, 1fr) auto;
        gap: 12px;
        align-items: center;
        padding: 12px 16px;
        background: var(--panel);
        border-radius: 12px;
      }
      .field { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
      .value { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .bet { display: flex; align-items: center; gap: 6px; }
      button {
        font: inherit;
        color: var(--bg);
        background: var(--accent);
        border: 0;
        border-radius: 8px;
        padding: 6px 10px;
        font-weight: 700;
        cursor: pointer;
      }
      button:disabled { opacity: 0.45; cursor: default; }
      #spin { padding: 12px 20px; font-size: 18px; }
      #status { min-height: 1.4em; color: var(--muted); font-size: 14px; }
      #status.error { color: var(--danger); }
      #exit { background: transparent; color: var(--muted); text-decoration: underline; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="hud">
      <div class="field">
        <span class="label">Balance</span>
        <span class="value" id="balance">—</span>
      </div>
      <div class="field">
        <span class="label">Bet</span>
        <span class="bet">
          <button id="bet-down" aria-label="Lower bet">−</button>
          <span class="value" id="bet">—</span>
          <button id="bet-up" aria-label="Raise bet">+</button>
        </span>
      </div>
      <div class="field">
        <span class="label">Win</span>
        <span class="value" id="win">—</span>
      </div>
      <button id="spin" disabled>Spin</button>
    </div>
    <div id="status" role="status"></div>
    <button id="exit" disabled>Exit (logout)</button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
